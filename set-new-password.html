<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Student Facial Recognition</title>
    <link rel="stylesheet" href="css/set-new-password.css">
    
</head>
<body>
    <div class="login-card">
       
        <h2>Set New Password</h2>
        <p class="subtitle">Create a new password for your account</p>
        
        <div class="success-message" id="successMessage">
            Password reset successful! Redirecting to login...
        </div>
        
        <div class="error-message" id="errorMessage">
         Password reset failed. Please try again.
        </div>

        <form id="setPasswordForm">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password (min 6 characters)">
                <div class="error-msg" id="passwordError">Password must be at least 6 characters</div>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your new password">
                <div class="error-msg" id="confirmError">Passwords do not match</div>
            </div>
            
            <button type="submit" class="btn-submit" id="resetPasswordBtn">Reset Password</button>
            <a href="login.html" class="btn-back">← Back to Login</a>
        </form>
    </div>

    <script src="js/set-new-password.js"></script>
</body>
</html>
