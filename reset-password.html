<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Student Facial Recognition</title>
    <link rel="stylesheet" href="css/reset-password.css">
    
</head>
<body>
    <div class="login-card">
        
        <h2>Reset Password</h2>
        <p class="subtitle">Enter your email address and we'll send you an OTP to reset your password</p>
        
        <div class="success-message" id="successMessage">
            OTP sent successfully! Please check your email.
        </div>
        
        <div class="error-message" id="errorMessage">
            Email not found. Please check your email address.
        </div>

        <form id="resetForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
                <div class="error-msg" id="emailError">Please enter a valid email address</div>
            </div>
            
            <button type="submit" class="btn-submit" id="sendOtpBtn">Send OTP</button>
            <a href="login.html" class="btn-back">← Back to Login</a>
        </form>
    </div>

    <script src="js/reset-password.js"></script>
</body>
</html>
