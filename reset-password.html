<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Student Facial Recognition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset-password.css">
</head>
<body>
    <div class="login-card">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 13c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z"/>
            </svg>
        </div>
        <h2>Reset Password</h2>
        <p class="subtitle">Enter your email address and we'll send you an OTP to reset your password</p>
        
        <div class="success-message" id="successMessage">
            ✅ OTP sent successfully! Please check your email.
        </div>
        
        <div class="error-message" id="errorMessage">
            ❌ Email not found. Please check your email address.
        </div>

        <form id="resetForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
                <div class="error-msg" id="emailError">Please enter a valid email address</div>
            </div>
            
            <button type="submit" class="btn-submit" id="sendOtpBtn">Send OTP</button>
            <a href="login.html" class="btn-back">← Back to Login</a>
        </form>
    </div>

    <script src="js/reset-password.js"></script>
</body>
</html>
