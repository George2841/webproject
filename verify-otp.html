<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>
    <link rel="stylesheet" href="css/verify-otp.css">
    
</head>
<body>
    <div class="login-card">
        
        <h2>Verify OTP</h2>
        <p class="subtitle">Enter the 6-digit OTP sent to your email</p>
        <form id="verifyOtpForm">
            <div class="form-group">
                <label for="otp">Enter OTP Code</label>
                <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6" required>
                <div class="error-msg" id="otpError">Please enter a valid 6-digit OTP</div>
            </div>
            
            <div class="resend-container">
                <p>Didn't receive OTP? <a href="#" id="resendOtp">Resend OTP</a></p>
            </div>
            
            <button type="submit" class="btn-submit" id="verifyOtpBtn">Verify OTP</button>
            <a href="reset-password.html" class="btn-back">← Back</a>
        </form>
    </div>

    <script src="js/verify-otp.js"></script>
</body>
</html>
